{% extends "base.html" %}

{% block title %}Account Profile - RETURNITY{% endblock %}

{% block content %}
<div class="container container-narrow" style="padding-top: 2rem; padding-bottom: 3rem;">
  <div class="section-title-wrap" style="text-align: left; margin-bottom: 1.5rem;">
    <span class="section-kicker">Settings</span>
    <h1 class="section-title">My Account Profile</h1>
  </div>

  <!-- Profile Information Form -->
  <div class="form-card" style="margin-bottom: 2rem;">
    <h2 style="font-size: 1.3rem; margin-bottom: 1.25rem; color: var(--color-tamarind);">Personal Information</h2>
    
    <form action="{{ url_for('profile') }}" method="POST">
      <input type="hidden" name="action" value="update_profile">

      <div class="form-group">
        <label for="profName">Full Name <span class="required-asterisk">*</span></label>
        <input type="text" id="profName" name="full_name" class="form-control" value="{{ user.full_name }}" required>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="profEmail">Registered Email</label>
          <input type="email" id="profEmail" class="form-control" value="{{ user.email }}" disabled style="background-color: var(--bg-subtle);">
          <span class="form-help">Primary email is fixed to maintain verification audit integrity.</span>
        </div>

        <div class="form-group">
          <label for="profPhone">Contact Phone Number</label>
          <input type="tel" id="profPhone" name="phone" class="form-control" value="{{ user.phone or '' }}" placeholder="e.g., 9876543210">
        </div>
      </div>

      <div style="margin-top: 1rem;">
        <button type="submit" class="btn btn-primary">Update Profile Details</button>
      </div>
    </form>
  </div>

  <!-- Password Change Form -->
  <div class="form-card">
    <h2 style="font-size: 1.3rem; margin-bottom: 1.25rem; color: var(--color-tamarind);">Change Account Password</h2>

    <form action="{{ url_for('profile') }}" method="POST">
      <input type="hidden" name="action" value="change_password">

      <div class="form-group">
        <label for="currentPassword">Current Password <span class="required-asterisk">*</span></label>
        <input type="password" id="currentPassword" name="current_password" class="form-control" required>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="newPassword">New Password <span class="required-asterisk">*</span></label>
          <input type="password" id="newPassword" name="new_password" class="form-control" minlength="6" required>
        </div>

        <div class="form-group">
          <label for="confirmNewPassword">Confirm New Password <span class="required-asterisk">*</span></label>
          <input type="password" id="confirmNewPassword" name="confirm_new_password" class="form-control" minlength="6" required>
        </div>
      </div>

      <div style="margin-top: 1rem;">
        <button type="submit" class="btn btn-secondary">Update Password</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
