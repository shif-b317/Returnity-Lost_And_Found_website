{% extends "base.html" %}

{% block title %}Administrator Login - RETURNITY{% endblock %}

{% block content %}
<div class="container container-narrow" style="padding-top: 3.5rem; padding-bottom: 3.5rem;">
  <div class="form-card" style="max-width: 460px; margin: 0 auto; border-top: 4px solid var(--color-rubine);">
    <div style="text-align: center; margin-bottom: 1.75rem;">
      <img src="{{ url_for('static', filename='images/logo_icon.svg') }}" alt="RETURNITY" style="height: 52px; width: auto; margin: 0 auto 0.75rem;">
      <h1 style="font-size: 1.6rem; margin-bottom: 0.35rem; color: var(--color-tamarind);">Administrator Portal</h1>
      <p style="font-size: 0.85rem; color: var(--text-secondary);">
        Restricted console for claim verification, risk evaluation, and user governance.
      </p>
    </div>

    <form action="{{ url_for('admin_login') }}" method="POST">
      <div class="form-group">
        <label for="adminEmail">Administrative Email <span class="required-asterisk">*</span></label>
        <input type="email" id="adminEmail" name="email" class="form-control" placeholder="admin@returnity.org" required autofocus>
      </div>

      <div class="form-group">
        <label for="adminPassword">Password <span class="required-asterisk">*</span></label>
        <input type="password" id="adminPassword" name="password" class="form-control" placeholder="Enter administrator password" required>
      </div>

      <div style="margin-top: 1.5rem;">
        <button type="submit" class="btn btn-primary btn-block btn-lg">Authenticate to Console</button>
      </div>
    </form>

    <div style="text-align: center; margin-top: 1.5rem; font-size: 0.82rem; color: var(--text-muted);">
      Unauthorized access attempts are recorded in the system audit log.
    </div>
  </div>
</div>
{% endblock %}
