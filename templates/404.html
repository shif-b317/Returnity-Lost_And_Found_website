{% extends "base.html" %}

{% block title %}Page Not Found (404) - RETURNITY{% endblock %}

{% block content %}
<div class="container container-narrow" style="padding-top: 4rem; padding-bottom: 4rem; text-align: center;">
  <div class="card" style="padding: 3rem 2rem; max-width: 540px; margin: 0 auto;">
    <div style="font-family: var(--font-serif); font-size: 3.5rem; font-weight: 700; color: var(--color-boho); line-height: 1;">404</div>
    <h1 style="font-size: 1.75rem; margin-top: 1rem; margin-bottom: 0.75rem;">Listing or Page Not Found</h1>
    <p style="color: var(--text-secondary); margin-bottom: 2rem; line-height: 1.6;">
      The requested report, claim, or address does not exist or has been relocated within the system.
    </p>
    <div style="display: flex; gap: 0.75rem; justify-content: center; flex-wrap: wrap;">
      <a href="{{ url_for('index') }}" class="btn btn-primary">Return to Homepage</a>
      <a href="{{ url_for('search') }}" class="btn btn-outline">Search All Items</a>
    </div>
  </div>
</div>
{% endblock %}
