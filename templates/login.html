{% extends "base.html" %}

{% block title %}Sign In - RETURNITY{% endblock %}

{% block content %}
<div class="container container-narrow" style="padding-top: 3rem; padding-bottom: 2rem;">
  <div class="form-card" style="max-width: 480px; margin: 0 auto;">
    <div style="text-align: center; margin-bottom: 1.75rem;">
      <img src="{{ url_for('static', filename='images/logo_icon.svg') }}" alt="RETURNITY Emblem" style="height: 54px; width: auto; margin: 0 auto 0.75rem;">
      <h1 style="font-size: 1.75rem; margin-bottom: 0.35rem;">Account Sign In</h1>
      <p style="font-size: 0.88rem; color: var(--text-secondary);">
        Access your reports, manage submitted claims, and review updates.
      </p>
    </div>

    <form action="{{ url_for('login') }}" method="POST">
      <div class="form-group">
        <label for="loginEmail">Email Address <span class="required-asterisk">*</span></label>
        <input type="email" id="loginEmail" name="email" class="form-control" placeholder="name@domain.com" required autofocus>
      </div>

      <div class="form-group">
        <label for="loginPassword">Password <span class="required-asterisk">*</span></label>
        <input type="password" id="loginPassword" name="password" class="form-control" placeholder="Enter your password" required>
      </div>

      <div style="margin-top: 1.5rem;">
        <button type="submit" class="btn btn-primary btn-block btn-lg">Sign In</button>
      </div>
    </form>

    <div style="text-align: center; margin-top: 1.5rem; padding-top: 1.25rem; border-top: 1px solid var(--border-subtle); font-size: 0.88rem; color: var(--text-secondary);">
      Do not have an account yet?
      <a href="{{ url_for('register') }}" style="font-weight: 600;">Create an Account</a>
    </div>

    <div style="text-align: center; margin-top: 0.75rem; font-size: 0.82rem;">
      <a href="{{ url_for('admin_login') }}" style="color: var(--color-boho);">Administrator Portal Login</a>
    </div>
  </div>
</div>
{% endblock %}
