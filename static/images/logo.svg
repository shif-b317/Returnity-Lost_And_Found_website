<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="100%" height="100%">
  <defs>
    <style>
      .brand-r { fill: #8D3A3C; font-family: 'Cinzel', 'Playfair Display', 'Georgia', serif; font-weight: 700; }
      .brand-hand { fill: #7B694E; }
      .brand-pin { fill: #8D3A3C; }
      .brand-title { fill: #C6B39A; font-family: 'Cinzel', 'Playfair Display', 'Georgia', serif; font-weight: 700; letter-spacing: 6px; font-size: 34px; }
      .brand-tagline { fill: #C6B39A; font-family: 'Inter', 'Segoe UI', sans-serif; font-size: 13px; letter-spacing: 2px; font-style: italic; }
      .brand-line { stroke: #7B694E; stroke-width: 1.5; stroke-linecap: round; }
    </style>
  </defs>

  <!-- Emblem Icon -->
  <g transform="translate(10, 10)">
    <!-- Base circle / background -->
    <circle cx="50" cy="50" r="46" fill="#280B0F" stroke="#7B694E" stroke-width="2"/>
    
    <!-- Stylized R shape -->
    <path d="M 32 78 L 32 24 L 56 24 C 68 24 76 31 76 42 C 76 52 68 58 58 59 L 76 78 L 62 78 L 46 60 L 44 60 L 44 78 Z" fill="#8D3A3C" />
    
    <!-- Inner cut-out showing hand and pin -->
    <circle cx="53" cy="42" r="16" fill="#1C0609" />
    
    <!-- Location Pin inside the R loop -->
    <path d="M 53 32 C 49.5 32 47 34.5 47 37.5 C 47 41.5 53 48 53 48 C 53 48 59 41.5 59 37.5 C 59 34.5 56.5 32 53 32 Z" fill="#8D3A3C"/>
    <circle cx="53" cy="37" r="2" fill="#C6B39A"/>

    <!-- Reconnecting Hand holding / supporting base -->
    <path d="M 38 48 C 37 54 41 60 48 62 C 55 64 63 61 67 56 C 65 57 60 59 55 58 C 47 56 42 51 40 48 Z" fill="#C6B39A"/>
  </g>

  <!-- Typography: RETURNITY -->
  <text x="135" y="62" class="brand-title">RETURNITY</text>
  
  <!-- Subtle divider lines and tagline -->
  <line x1="135" y1="84" x2="200" y2="84" class="brand-line" />
  <text x="210" y="88" class="brand-tagline">Lost it? Return to it.</text>
  <line x1="390" y1="84" x2="475" y2="84" class="brand-line" />
</svg>
